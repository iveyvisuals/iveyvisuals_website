<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Lexend';src:url('fonts/Lexend-VariableFont_wght.ttf') format('truetype');font-weight:100 900}
:root{--blush:#ecdcd5;--cream:#f5f0ea;--serif:'Fraunces',Georgia,serif;--sans:'Lexend',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}em{font-style:normal}
body{font-family:var(--sans)}
.pain-sticky{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:36px;overflow:hidden;position:relative;background:url('img/studio_wall.jpg') center/cover no-repeat}
.pain-sticky::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(15,7,7,.78) 0%,rgba(101,12,5,.5) 100%)}
.pain-header{text-align:center;padding-inline:80px;position:relative;z-index:1}
.pain-header h2{font-family:var(--serif);font-weight:400;font-size:5.6rem;line-height:1.0;color:var(--cream);letter-spacing:-.02em;margin-bottom:16px}
.pain-header h2 em{font-weight:300;color:var(--blush)}
.pain-header p{font-size:1.1rem;color:rgba(245,240,234,.55);letter-spacing:.02em}
.pain-stage{position:relative;width:100%;max-width:760px;padding-inline:80px;height:90px;z-index:1}
.pain-card{position:absolute;inset:0;border-radius:999px;padding:8px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(245,240,234,.08);backdrop-filter:blur(18px) saturate(1.2);border:1px solid rgba(245,240,234,.14)}
.pain-text{font-family:var(--sans);font-weight:300;font-size:1.0rem;letter-spacing:.01em;color:rgba(245,240,234,.92);line-height:1.4;text-wrap:balance}
</style></head><body>
<div class="pain-sticky">
  <div class="pain-header">
    <h2>You've Got A Business.<br><em>Your Brand Should Show It.</em></h2>
    <p>Be honest — does this sound like you?</p>
  </div>
  <div class="pain-stage">
    <div class="pain-card">
      <p class="pain-text">Tired of generic templates that look just like everyone else's?</p>
    </div>
  </div>
</div>
</body></html>
