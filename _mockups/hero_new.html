<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,400;1,9..144,700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Lexend';src:url('fonts/Lexend-VariableFont_wght.ttf') format('truetype');font-weight:100 900}
  :root{--wine:#650c05;--blush:#ecdcd5;--cream:#f5f0ea;--ink:#141212;--muted:#6f6764;--serif:'Fraunces',Georgia,serif;--sans:'Lexend',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:#000}

  /* ── HERO ── */
  .hero{
    position:relative;
    min-height:calc(100svh - 96px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* full-bleed photo */
  .hero-photo{
    position:absolute;inset:0;
  }
  .hero-photo img{
    width:100%;height:100%;object-fit:cover;object-position:center 20%;
  }
  /* dark gradient overlay so text reads clearly */
  .hero-photo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,
      rgba(10,4,4,.15) 0%,
      rgba(10,4,4,.45) 40%,
      rgba(10,4,4,.65) 100%);
  }

  /* copy block — centered over photo */
  .hero-copy{
    position:relative;z-index:2;
    text-align:center;
    padding:0 clamp(24px,5vw,80px);
    max-width:900px;
  }
  .hero-eyebrow{
    display:block;
    font-family:var(--sans);
    font-size:.75rem;
    letter-spacing:.22em;
    color:rgba(236,220,213,.7);
    margin-bottom:clamp(16px,2vw,24px);
  }
  .hero-headline{
    font-family:var(--serif);
    font-weight:700;
    font-size:clamp(2.8rem,6vw,6.5rem);
    line-height:.95;
    color:var(--cream);
    letter-spacing:-.02em;
    margin-bottom:clamp(24px,3vw,40px);
  }
  .hero-headline em{
    font-style:italic;
    font-weight:300;
    color:var(--blush);
  }
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--wine);color:var(--cream);
    padding:.95em 2.2em;border-radius:999px;
    font-size:.88rem;font-family:var(--sans);
    text-decoration:none;letter-spacing:.04em;
  }

  /* ── MARQUEE TICKER ── */
  .ticker{
    position:relative;z-index:3;
    background:var(--wine);
    padding:14px 0;
    overflow:hidden;
    white-space:nowrap;
    margin-top:auto; /* push to bottom */
  }
  .ticker-track{
    display:inline-flex;
    animation:ticker 22s linear infinite;
  }
  .ticker-item{
    font-family:var(--sans);
    font-size:.78rem;
    letter-spacing:.16em;
    color:var(--blush);
    padding:0 clamp(24px,3vw,48px);
  }
  .ticker-item .star{
    margin:0 clamp(10px,1.5vw,20px);
    color:rgba(236,220,213,.45);
  }
  @keyframes ticker{
    0%{transform:translateX(0)}
    100%{transform:translateX(-50%)}
  }
</style>
</head><body>
<section class="hero">
  <div class="hero-photo">
    <img src="img/hero_extended.jpg" alt="Isabella Villaroman working at laptop">
  </div>

  <div class="hero-copy">
    <span class="hero-eyebrow">DESIGN. CREATE. ELEVATE.</span>
    <h1 class="hero-headline">
      Your Brand Should<br>
      <em>Feel Like You.</em><br>
      Everywhere.
    </h1>
    <a href="#contact" class="btn">Let's Design Together →</a>
  </div>

  <div class="ticker">
    <div class="ticker-track">
      <!-- duplicate for seamless loop -->
      <span class="ticker-item">WEB DESIGN <span class="star">★</span> GRAPHIC DESIGN <span class="star">★</span> CONTENT CREATION <span class="star">★</span> BRANDING <span class="star">★</span> LET'S BUILD YOUR BRAND TOGETHER <span class="star">★</span></span>
      <span class="ticker-item">WEB DESIGN <span class="star">★</span> GRAPHIC DESIGN <span class="star">★</span> CONTENT CREATION <span class="star">★</span> BRANDING <span class="star">★</span> LET'S BUILD YOUR BRAND TOGETHER <span class="star">★</span></span>
    </div>
  </div>
</section>
</body></html>
